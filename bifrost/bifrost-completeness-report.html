      { name: "Eventing", rating: "Missing", evidence: "0 events" },
      { name: "Analytical Sink", rating: "Not Trackable", evidence: "N/A" },
      { name: "Versioning", rating: "Missing", evidence: "No entities to version" },
      { name: "Documented", rating: "Missing", evidence: "No entities to document" },
      { name: "MCP Server Tools", rating: "Not Trackable", evidence: "N/A" },
      { name: "GAB Discoverability", rating: "Not Trackable", evidence: "N/A" }
    ],
    priority: "Still an empty shell, but now owned. PurchaseOrder's description already plans a Contracts-to-PO integration -- populate to unblock it."
  }
];

const MISSING_DOMAINS = [
  {
    name: "Government App Builder", jiraId: "GAB", severity: "critical",
    evidence: "30 active repos org-wide in the last 90 days (gab-frontend, gab-backend, gab-core, gab-boilerplate, gab-workflows, gab-ocr-service, gab-ai-gateway, gab-import-service...), several pushed same-day.",
    note: "Zero domains modeled -- the underlying app-builder platform itself, distinct from the product offerings built on top of it (311, Grants Management -- see below)."
  },
  {
    name: "311", jiraId: "GAB-311", severity: "high",
    evidence: "gab-311, gab-ogc-311 -- both active, pushed same-day.",
    note: "Own product offering (citizen request/311 management), built on the GAB platform but not itself represented anywhere in the catalog. Zero domains modeled."
  },
  {
    name: "Grants Management", jiraId: "GAB-GRANTS", severity: "high",
    evidence: "gab-grants-management -- active, pushed same-day.",
    note: "Own product offering built on the GAB platform, not itself represented anywhere in the catalog. Zero domains modeled."
  },
  {
    name: "Permitting & Licensing", jiraId: "PLC", severity: "critical",
    evidence: "30 active repos (plc-ember-apps, plc-rails-api, plc-mobile-app, plc-service-payments, plc-service-records, plc-service-search, plc-service-notifications...), most pushed within the last 24h.",

  },
  {
    name: "Budgeting & Planning", jiraId: "BNP", severity: "critical",

    note: "Zero domains modeled."
  },
  {
    name: "Payroll", jiraId: "PAYROLL", severity: "high",
    evidence: "payroll, payroll-app, payroll-gf-app, payroll-prosim, payroll-app-reports-service -- all active.",

  },
  {
    name: "Tax & Revenue", jiraId: "TNR", severity: "high",

  },
  {

    evidence: "utility-billing monorepo (very active), k8s-deployment-utility-billing.",

  },
  {
    name: "Access Control", jiraId: "ACE", severity: "medium",
    evidence: "ace-service (\"miniservice with user-management and access control APIs\"), ace-mcp-server -- active.",
    note: "TaskManagement's own summary references ACE claim-based access (TASKMASTER_VIEWER etc.) but no ACE bounded context exists in the catalog."
  },
  {
    name: "Reporting & Transparency", jiraId: "RNT", severity: "medium",
    evidence: "rnt-spring-auth-lib, bnp-rnt-coa-registry-service, fin-to-rnt-event-transformer -- smaller but active footprint; legacy TransparencyAPI/ReportApp (2019-2020) appear to be mid-replacement.",
    note: "Zero domains modeled. Smallest gap of the group, but still not represented."
  }
];

const PRINCIPLES = [
  { name: "Ownership", desc: "Does the domain have a clear owning team?" },
  { name: "Service/APIs", desc: "Are services defined with commands and queries?" },
  { name: "Eventing", desc: "Are domain events published with schemas and Kafka channels?" },
  { name: "Analytical Sink", desc: "Is analytical data surfaced? (Not Trackable -- lives in SageMaker Studio)" },
  { name: "Versioning", desc: "Are entities versioned with business invariants?" },
  { name: "Documented", desc: "Do entities have property definitions, descriptions, types?" },
  { name: "MCP Server Tools", desc: "Are MCP tools registered? (Not Trackable -- not yet built)" },
  { name: "GAB Discoverability", desc: "Are objects discoverable in Government App Builder? (Not Trackable)" }
];

const ISSUES = [
  { severity: "critical", title: "Service-to-service dependency graph is still structurally empty", desc: "get_service_dependencies returns 0 upstream / 0 downstream for InvoiceService, ChartOfAccountsService, VendorService, and HcmApi. PurchaseOrder's entity description now narrates real dependencies (AP, GL, PurchaseRequests, Contracts) in prose, but none of it is encoded as graph edges consumers can query." },
  { severity: "high", title: "PurchaseOrder's own namesake entity remains undocumented", desc: "The PurchaseOrder entity has an empty property array and no invariants section, even though sibling entities in the same domain -- ChangeOrder, LineItem -- are now well documented. The domain's most-referenced entity is its weakest link." },
  { severity: "high", title: "RevenueCore entities are unchanged since last grading", desc: "Account and Customer still have empty property arrays and placeholder summaries ('Account entity', 'Customer entity'), despite the domain gaining an assigned owner this cycle." },
  { severity: "medium", title: "Cross-domain entity ID collisions", desc: "\"Position\", \"Requisition\", and \"User\" are each defined independently in two unrelated domains (procurement vs. HCM vs. PCard) under the same bare entity ID with different schemas -- a consumer resolving by ID alone risks pulling the wrong domain's definition. (Vendor previously had this problem too; it's now resolved -- see below.)" },
  { severity: "medium", title: "HumanCapitalManagement's entity list reads as partly commands", desc: "Items like Run, Send, Seed, Unblock, and Simulate look like operations, not domain entities. This is the same entity/command conflation pattern the catalog resolved globally last cycle, recurring locally within HCM's 259-item entity list." },
  { severity: "medium", title: "PurchaseCard has two teams claiming ownership", desc: "erp-fin-pcard-team formally owns the domain (ownedDomainIds includes PurchaseCard). pcard-team's own summary also describes owning it, but its ownedDomainIds is empty. Minor, but worth reconciling before it causes a real ownership dispute." },
  { severity: "medium", title: "Still zero flow definitions", desc: "list_flows returns 0 results, unchanged since last grading. With Requests and Receipts now populated, a full Procure-to-Pay flow (Requisition to Request to PO to Receipt to Invoice to PaymentRun) is modelable for the first time -- it just hasn't been done." },
  { severity: "high", title: "8 of 13 OpenGov products have no domain in the catalog at all", desc: "GAB, PLC, and BNP are among the most actively developed products org-wide (30+ active repos each in the last 90 days) yet have zero Bifrost representation. Payroll, Tax & Revenue, Utility Billing, Access Control, and Reporting & Transparency are also uncataloged. GAB's own product offerings -- 311 and Grants Management -- are additionally uncataloged in their own right, not merely as a byproduct of GAB being missing. See the new Missing Domains tab." },
  { severity: "medium", title: "RevenueCore does not actually cover Tax & Revenue or Utility Billing", desc: "Verified directly: WaterMeter is only modeled under EnterpriseAssetManagement (as a physical asset), not under RevenueCore or linked to any billing entity, and no meter-reading/consumption entity exists anywhere in the catalog. RevenueCore's 9 entities are generic account/customer/rate scaffolding with no TNR- or UB-specific concepts -- it does not functionally cover either product." }
];

const RECS = [
  { title: "Turn PurchaseOrder's prose dependencies into real graph edges.", desc: "The domain's own description already names AP, GL, PurchaseRequests, and Contracts as upstream/downstream partners. Encode those as service-dependency edges -- the qualitative knowledge already exists, it just isn't structured." },
  { title: "Document the PurchaseOrder aggregate itself.", desc: "Use ChangeOrder or Receipt as the in-house template -- both now ship full property lists and concrete invariants. PurchaseOrder is the one entity in its own domain still at properties: []." },
  { title: "Split HumanCapitalManagement's single service into bounded sub-capabilities.", desc: "259 entities behind one monolithic HcmApi is thin relative to AP's 14 services or PO's 12 for comparable complexity. Payroll, recruiting, and time & attendance look like natural seams. Audit the entity list for command-like items (Run, Send, Seed) while at it." },
  { title: "Define invariants for the remaining TBD entities.", desc: "Vendor, Invoice, PaymentRun, JournalEntryControl, Task, CardProgram, NotificationRequest, WaterMeter, WorkOrder. Receipt and ChangeOrder already show what a real invariants section looks like -- copy the pattern." },
  { title: "Resolve entity ID collisions.", desc: "Position, Requisition, and User each mean different things in different domains under the same bare ID. Either namespace by domain or document explicitly that the collision is intentional." },
  { title: "Create at least one end-to-end flow definition.", desc: "Procure-to-Pay (Requisition -> Request -> PurchaseOrder -> Receipt -> Invoice -> PaymentRun) is fully modelable now that Requests and Receipts exist as domains -- this was blocked before, it isn't anymore." }
];

function getScoreClass(score) {
  if (score >= 80) return "high";
  if (score >= 50) return "medium";
  return "low";
}
function getScoreColorClass(score) {
  if (score >= 80) return "score-green";
  if (score >= 50) return "score-yellow";
  return "score-red";
}
function getRatingClass(rating) {
  if (rating === "Met") return "rating-met";
  if (rating === "Partial") return "rating-partial";
  if (rating === "Missing") return "rating-missing";
  return "rating-na";
}

function SummaryCards() {
  var avgScore = Math.round(DOMAINS.reduce(function(s, d) { return s + d.score; }, 0) / DOMAINS.length);
  var emptyDomains = DOMAINS.filter(function(d) { return d.score === 0; }).length;
  var criticalCount = ISSUES.filter(function(i) { return i.severity === "critical"; }).length;
  return e("div", { className: "summary-grid" },
    e("div", { className: "summary-card" },
      e("div", { className: "value " + getScoreColorClass(avgScore) }, avgScore + "%"),
      e("div", { className: "label" }, "Average Compliance")
    ),
    e("div", { className: "summary-card" },
      e("div", { className: "value" }, DOMAINS.length),
      e("div", { className: "label" }, "Total Domains")
    ),
    e("div", { className: "summary-card" },
      e("div", { className: "value score-red" }, emptyDomains),
      e("div", { className: "label" }, "Empty Shell Domains")
    ),
    e("div", { className: "summary-card" },
      e("div", { className: "value score-red" }, criticalCount),
      e("div", { className: "label" }, "Critical Issues")
    ),
    e("div", { className: "summary-card" },
      e("div", { className: "value score-red" }, MISSING_DOMAINS.length),
      e("div", { className: "label" }, "OpenGov Products Not Cataloged")
    )
  );
}

function DomainCard(props) {
  var d = props.domain;
  var isOpen = props.isOpen;
  var onToggle = props.onToggle;
  return e("div", { className: "domain-card" },
    e("div", { className: "domain-header", onClick: onToggle },
      e("div", { className: "domain-info" },
        e("div", null,
          e("span", { className: "domain-name" }, d.name),
          e("span", { className: "domain-version", style: { marginLeft: 8 } }, "v" + d.version)
        ),
        e("span", { className: "domain-owner" }, d.owner)
      ),
      e("div", { className: "domain-stats" },
        e("span", { className: "stat-chip" }, d.services + " svc"),
        e("span", { className: "stat-chip" }, d.entities + " ent"),
        e("span", { className: "stat-chip" }, d.events + " evt"),
        e("span", { className: "score-badge " + getScoreClass(d.score) }, d.score + "%"),
        e("span", { className: "chevron " + (isOpen ? "open" : "") }, "\u25BC")
      )
    ),
    isOpen ? e("div", { className: "domain-detail" },
      e("table", { className: "principle-table" },
        e("thead", null,
          e("tr", null,
            e("th", null, "Principle"),
            e("th", { style: { width: 110 } }, "Rating"),
            e("th", null, "Evidence")
          )
        ),
        e("tbody", null,
          d.principles.map(function(p, i) {
            return e("tr", { key: i },
              e("td", { style: { fontWeight: 500 } }, p.name),
              e("td", null, e("span", { className: "rating-pill " + getRatingClass(p.rating) }, p.rating)),
              e("td", { style: { color: "var(--text-muted)" } }, p.evidence)
            );
          })
        )
      ),
      e("div", { className: "priority-note" },
        e("strong", null, "Area to prioritize: "), d.priority
      )
    ) : null
  );
}

function ByDomainTab() {
  var openState = React.useState({});
  var openDomains = openState[0];
  var setOpenDomains = openState[1];
  function toggle(id) {
    setOpenDomains(function(prev) {
      var next = Object.assign({}, prev);
      next[id] = !prev[id];
      return next;
    });
  }
  return e("div", null,
    DOMAINS.map(function(d) {
      return e(DomainCard, {
        key: d.id,
        domain: d,
        isOpen: !!openDomains[d.id],
        onToggle: function() { toggle(d.id); }
      });
    })
  );
}

function ByPrincipleTab() {
  return e("div", null,
    PRINCIPLES.map(function(p, pi) {
      var met = [], partial = [], missing = [], na = [];
      DOMAINS.forEach(function(d) {
        var dp = d.principles.find(function(x) { return x.name === p.name; });
        if (!dp) return;
        if (dp.rating === "Met") met.push(d.name);
        else if (dp.rating === "Partial") partial.push(d.name);
        else if (dp.rating === "Missing") missing.push(d.name);
        else na.push(d.name);
      });
      return e("div", { key: pi, className: "principle-card" },
        e("h3", null, (pi + 1) + ". " + p.name),
        e("div", { className: "desc" }, p.desc),
        met.length > 0 ? e("div", { style: { marginBottom: 8 } },
          e("strong", { style: { fontSize: 12, color: "var(--green)" } }, "Met: "),
          e("span", { className: "domain-pill-list", style: { display: "inline-flex" } },
            met.map(function(n) { return e("span", { key: n, className: "domain-pill rating-met" }, n); })
          )
        ) : null,
        partial.length > 0 ? e("div", { style: { marginBottom: 8 } },
          e("strong", { style: { fontSize: 12, color: "var(--yellow)" } }, "Partial: "),
          e("span", { className: "domain-pill-list", style: { display: "inline-flex" } },
            partial.map(function(n) { return e("span", { key: n, className: "domain-pill rating-partial" }, n); })
          )
        ) : null,
        missing.length > 0 ? e("div", { style: { marginBottom: 8 } },
          e("strong", { style: { fontSize: 12, color: "var(--red)" } }, "Missing: "),
          e("span", { className: "domain-pill-list", style: { display: "inline-flex" } },
            missing.map(function(n) { return e("span", { key: n, className: "domain-pill rating-missing" }, n); })
          )
        ) : null,
        na.length > 0 ? e("div", null,
          e("strong", { style: { fontSize: 12, color: "var(--gray)" } }, "Not Trackable: "),
          e("span", { className: "domain-pill-list", style: { display: "inline-flex" } },
            na.map(function(n) { return e("span", { key: n, className: "domain-pill rating-na" }, n); })
          )
        ) : null
      );
    })
  );
}

function CrossCuttingTab() {
  return e("div", null,
    ISSUES.map(function(issue, i) {
      return e("div", { key: i, className: "issue-card" },
        e("div", { className: "issue-header" },
          e("span", { className: "severity-badge severity-" + issue.severity }, issue.severity),
          e("span", { className: "issue-title" }, issue.title)
        ),
        e("div", { className: "issue-desc" }, issue.desc)
      );
    })
  );
}

function MissingDomainsTab() {
  return e("div", null,
    e("div", { className: "priority-note", style: { marginBottom: 16 } },
      e("strong", null, "Method: "), "Cross-referenced the 15 domains live in the catalog against OpenGov's 13-product inventory (JIRA project / product ID / stack-profile / repo) and against every opengov org repo pushed in the last 90 days. 5 inventory products are fully covered (Procurement, Financials/ERP, Vendor Management, HCM, EAM). 8 inventory products below have zero or unattributed catalog representation despite active development. 311 and Grants Management are additionally listed as their own entries -- they're GAB-built product offerings, but distinct products in their own right, not just a byproduct of GAB being missing."
    ),
    MISSING_DOMAINS.map(function(m, i) {
      return e("div", { key: i, className: "issue-card" },
        e("div", { className: "issue-header" },
          e("span", { className: "severity-badge severity-" + m.severity }, m.severity),
          e("span", { className: "issue-title" }, m.name + " (" + m.jiraId + ")")
        ),
        e("div", { className: "issue-desc" },
          e("div", { style: { marginBottom: 4 } }, e("strong", null, "Evidence: "), m.evidence),
          e("div", null, e("strong", null, "Note: "), m.note)
        )
      );
    })
  );
}

function Recommendations() {
  return e("div", { className: "rec-section" },
    e("h2", null, "Top Recommendations"),
    RECS.map(function(r, i) {
      return e("div", { key: i, className: "rec-item" },
        e("div", { className: "rec-num" }, i + 1),
        e("div", { className: "rec-text" },
          e("strong", null, r.title), " ", r.desc
        )
      );
    })
  );
}

function App() {
  var tabState = React.useState("domain");
  var activeTab = tabState[0];
  var setActiveTab = tabState[1];
  return e("div", { className: "container" },
    e("div", { className: "header" },
      e("h1", null, "BiFrost Catalog Completeness Report"),
      e("p", null, "ADR-65 Shared Domain Object Principles | July 28, 2026")
    ),
    e(SummaryCards),
    e("div", { className: "tabs" },
      e("button", { className: "tab " + (activeTab === "domain" ? "active" : ""), onClick: function() { setActiveTab("domain"); } }, "By Domain"),
      e("button", { className: "tab " + (activeTab === "principle" ? "active" : ""), onClick: function() { setActiveTab("principle"); } }, "By Principle"),
      e("button", { className: "tab " + (activeTab === "issues" ? "active" : ""), onClick: function() { setActiveTab("issues"); } }, "Cross-Cutting Issues"),
      e("button", { className: "tab " + (activeTab === "missing" ? "active" : ""), onClick: function() { setActiveTab("missing"); } }, "Missing Domains")
    ),
    activeTab === "domain" ? e(ByDomainTab) : null,
    activeTab === "principle" ? e(ByPrincipleTab) : null,
    activeTab === "issues" ? e(CrossCuttingTab) : null,
    activeTab === "missing" ? e(MissingDomainsTab) : null,
    e(Recommendations),
    e("div", { className: "footer" }, "Generated by BiFrost Completeness Report -- scheduled weekly on Mondays at 8am | " + new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
